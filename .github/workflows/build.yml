# PAUSED: no automatic runs (push, pull request or schedule). The private repository's
# free Actions minutes are limited, and macOS minutes count 10x and Windows 2x. Run it
# by hand: Actions > build > Run workflow (tick "full" for macOS, Windows and the
# sanitizer job as well as Linux). To resume automatic runs, restore the triggers
# below from git history (commit daf3263).
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Also build and test macOS, Windows and the sanitizer job'
        type: boolean
        default: true

jobs:
  full-ci:
    # Decides whether the expensive jobs run (see the note at the top).
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 50
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=${{ inputs.full }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && \
               [ -n "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: full-ci
    if: github.event_name != 'schedule' || needs.full-ci.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libxml2-dev liblua5.2-dev libsndfile1-dev libfftw3-dev \
            portaudio19-dev libportmidi-dev libasound2-dev libjack-jackd2-dev libgtest-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev xvfb xauth

      - name: Cache fetched dependencies (JUCE)
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-${{ runner.os }}-${{ hashFiles('app/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test (libIntegra unit tests, smoke test, host audio, app self-test, GUI test)
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cd build && cpack

      - uses: actions/upload-artifact@v4
        with:
          name: integra-live-linux
          path: build/integra-live-*.tar.gz

  linux-sanitizers:
    needs: full-ci
    if: needs.full-ci.outputs.run == 'true'
    # AddressSanitizer + UndefinedBehaviorSanitizer over every test, including the
    # stress test (see docs/09-robustness.md). Leak checking is off: Pd never frees
    # its global state at exit.
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libxml2-dev liblua5.2-dev libsndfile1-dev libfftw3-dev \
            portaudio19-dev libportmidi-dev libasound2-dev libjack-jackd2-dev libgtest-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev xvfb xauth

      - name: Cache fetched dependencies (JUCE)
        uses: actions/cache@v4
        with:
          path: build/_deps/*-src
          key: deps-${{ runner.os }}-${{ hashFiles('app/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DINTEGRA_SANITIZE=ON

      - name: Build
        # fewer parallel jobs: sanitizer builds of the JUCE modules need a lot of memory
        run: cmake --build build --parallel 2

      - name: Test under the sanitizers
        run: ctest --test-dir build --output-on-failure

  macos:
    needs: full-ci
    if: needs.full-ci.outputs.run == 'true'
    # Self-contained universal (Apple Silicon + Intel) app: static vcpkg dependencies,
    # signed and packaged as a DMG. Signing/notarisation use repository secrets when
    # present (see docs/07-macos-packaging.md), otherwise the app is ad-hoc signed.
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and vcpkg
        run: |
          brew install ninja
          if [ -z "${VCPKG_INSTALLATION_ROOT:-}" ] || [ ! -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_INSTALLATION_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/cmake/triplets" \
            -DVCPKG_TARGET_TRIPLET=universal-osx-static \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -E gui_test

      - name: Check the app is universal and self-contained
        run: |
          for exe in "build/app/IntegraLive_artefacts/Release/Integra Live.app/Contents/MacOS/Integra Live" \
                     "build/module-creator/ModuleCreator_artefacts/Release/Integra Module Creator.app/Contents/MacOS/Integra Module Creator"; do
            lipo -info "$exe"
            lipo "$exe" -verify_arch arm64 x86_64
            otool -L "$exe"
            # library lines are indented; the others are per-architecture headers
            if otool -L "$exe" | grep -E '^\s' | grep -v -E '^\s+(/System/Library/|/usr/lib/)'; then
              echo "::error::$exe links libraries outside the OS"; exit 1
            fi
          done
          test -f "build/module-creator/ModuleCreator_artefacts/Release/Integra Module Creator.app/Contents/Resources/module-creator-resources/ModuleCreator_config.xml"

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Sign and package
        # one DMG with both apps, to drag into Applications side by side (the Module
        # Creator finds Integra Live next to it for "Test in Integra Live")
        run: |
          packaging/macos/package.sh "build/app/IntegraLive_artefacts/Release/Integra Live.app" IntegraLive-macOS.dmg \
            "build/module-creator/ModuleCreator_artefacts/Release/Integra Module Creator.app"

      - uses: actions/upload-artifact@v4
        with:
          name: integra-live-macos-universal
          path: IntegraLive-macOS.dmg

  windows:
    needs: full-ci
    if: needs.full-ci.outputs.run == 'true'
    # MSVC + vcpkg (dependencies from vcpkg.json); see docs/06-windows.md
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # restore/save split so the binary cache is kept even when a later step fails
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        id: test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure -E gui_test

      - name: Package
        shell: pwsh
        run: |
          $app = "build/app/IntegraLive_artefacts/RelWithDebInfo"
          New-Item -ItemType Directory -Force -Path package/IntegraLive | Out-Null
          Copy-Item "$app/Integra Live.exe" package/IntegraLive/
          Copy-Item -Recurse "$app/modules","$app/blocks","$app/resources","$app/viewInfo","$app/assets" package/IntegraLive/
          # the Module Creator beside Integra Live (each finds the other in the same folder)
          $creator = "build/module-creator/ModuleCreator_artefacts/RelWithDebInfo"
          Copy-Item "$creator/Integra Module Creator.exe" package/IntegraLive/
          Copy-Item -Recurse "$creator/module-creator-resources" package/IntegraLive/

      - uses: actions/upload-artifact@v4
        with:
          name: integra-live-windows-x64
          path: package/

      # A crashing test only reports "SegFault"; rerun one under the Windows debugger
      # to get a symbolised stack trace in the log.
      - name: Stack trace of a crashing test
        if: failure() && steps.test.outcome == 'failure'
        shell: pwsh
        working-directory: build/libIntegra/tests/workdir
        env:
          INTEGRA_RESOURCES_PATH: ${{ github.workspace }}/libIntegra/data
        run: |
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Output "cdb not found"; exit 0 }
          & $cdb -lines -c "sxe av; g; .ecxr; kP 40; q" `
            "${{ github.workspace }}\build\libIntegra\tests\RelWithDebInfo\integra_host_audio_test.exe" `
            "${{ github.workspace }}\modules"

